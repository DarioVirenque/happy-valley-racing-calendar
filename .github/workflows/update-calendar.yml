name: Update Happy Valley calendar

on:
  schedule:
    # Every 6 hours — keep the published ICS close to the official HKJC feed
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update-happy-valley-calendar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild calendar from official HKJC sources
        id: build
        run: |
          set -euo pipefail
          python3 build_happy_valley_calendar.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- docs/happy-valley.ics \
               Happy_Valley_Racing_2026-27_Details.csv \
               Happy_Valley_Racing_2026-27_README.md \
               data/sequences.json \
               data/preview_events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated calendar
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/happy-valley.ics \
                  Happy_Valley_Racing_2026-27_Details.csv \
                  Happy_Valley_Racing_2026-27_README.md \
                  data/sequences.json \
                  data/preview_events.json
          git commit -m "chore: refresh Happy Valley calendar from official HKJC feed"
          # Rebase onto remote in case another run (or manual push) landed first.
          git pull --rebase origin main
          if ! git push; then
            echo "Push rejected — rebasing once more and retrying"
            git pull --rebase origin main
            git push
          fi
